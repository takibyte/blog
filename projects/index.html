<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects | takibyte</title>
<meta name="description" content="Cybersecurity homelab projects, custom tools, and CTF writeups.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  (function(){
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">

<script src='/js/theme.js' defer></script>
</head>
<body>

<header>
  <a class="logo" href="/">takibyte</a>
  <nav>
    <a class="active" href="/projects/">Projects</a>
    <a href="/logs/">Logs</a>
    <a href="/about/">About</a>
  </nav>
  {{themeSelect}}
  <!-- <a class="subscribe" href="#">subscribe →</a> -->
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span>
  </button>
</header>

<div class="mobile-nav" id="mobileNav">
  <a class="active" href="/projects/">Projects</a>
  <a href="/logs/">Logs</a>
  <a href="/about/">About</a>
  {{themeSelectMobile}}
  <!-- <a class="subscribe" href="#">subscribe →</a> -->
</div>

<main>
  <div class="page-intro">
    <div class="kicker">// ongoing series &amp; tools</div>
    <h1>Projects</h1>
    <p>Cybersecurity homelab projects — organised into log series and custom tool projects.</p>
  </div>

<div class="status-filter">
  <span class="tag-filter active" data-filter="all">All</span>
  <!-- <span class="tag-filter" data-group="status" data-filter="active">Active</span>
  <span class="tag-filter" data-group="status" data-filter="complete">Complete</span> -->
  <span class="tag-filter" data-group="type" data-filter="series">Series</span>
  <span class="tag-filter" data-group="type" data-filter="tool">Tool</span>
</div>

  <div class="project-grid">

    {{projectList}}

  </div>
</main>

<footer>
  <span><a href="https://takibyte.com">takibyte.com</a> — est. 2026</span>
  <span><a href="https://github.com/takibyte">GitHub</a> · <a href="https://tryhackme.com/p/takibyte">TryHackMe</a></span>
</footer>

<script>
// Mobile menu toggle
const menuToggle = document.getElementById('menuToggle');
const mobileNav = document.getElementById('mobileNav');
menuToggle.addEventListener('click', () => {
  const isOpen = mobileNav.classList.toggle('open');
  menuToggle.classList.toggle('open', isOpen);
  menuToggle.setAttribute('aria-expanded', isOpen);
});

// Status filter functionality
const tagFilters = document.querySelectorAll('.tag-filter');
const allTag = document.querySelector('.tag-filter[data-filter="all"]');
const projects = document.querySelectorAll('.project-card');

let activeStatus = null; // 'active' | 'complete' | null
let activeType = null;   // 'series' | 'tool' | null

function applyFilters() {
  projects.forEach(project => {
    const status = project.dataset.status || '';
    const type = project.dataset.type || '';

    const matchesStatus = !activeStatus || status === activeStatus;
    const matchesType = !activeType || type === activeType;

    project.style.display = (matchesStatus && matchesType) ? '' : 'none';
  });
}

function updateAllState() {
  const noneActive = !activeStatus && !activeType;
  allTag.classList.toggle('active', noneActive);
}

allTag.addEventListener('click', () => {
  activeStatus = null;
  activeType = null;
  tagFilters.forEach(t => t.classList.remove('active'));
  allTag.classList.add('active');
  applyFilters();
});

tagFilters.forEach(tag => {
  if (tag === allTag) return;

  tag.addEventListener('click', () => {
    const group = tag.dataset.group;
    const filter = tag.dataset.filter;
    const isAlreadyActive = tag.classList.contains('active');

    // clear other tags in the same group only
    tagFilters.forEach(t => {
      if (t.dataset.group === group) t.classList.remove('active');
    });

    if (isAlreadyActive) {
      // clicking an active tag again deselects it (back to "any" for that group)
      if (group === 'status') activeStatus = null;
      if (group === 'type') activeType = null;
    } else {
      tag.classList.add('active');
      if (group === 'status') activeStatus = filter;
      if (group === 'type') activeType = filter;
    }

    allTag.classList.remove('active');
    updateAllState();
    applyFilters();
  });
});

applyFilters();
updateAllState();

</script>

</body>
</html>
