<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects | takibyte</title>
<meta name="description" content="Cybersecurity homelab projects, custom tools, and CTF writeups.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  (function(){
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">

<script src='/js/theme.js'></script>
</head>
<body>

<header>
  <a class="logo" href="/">takibyte</a>
  <nav>
    <a class="active" href="/projects/">Projects</a>
    <a href="/posts/">Posts</a>
    <a href="/about/">About</a>
  </nav>
  {{themeSelect}}
  <!-- <a class="subscribe" href="#">subscribe →</a> -->
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span>
  </button>
</header>

<div class="mobile-nav" id="mobileNav">
  <a class="active" href="/projects/">Projects</a>
  <a href="/posts/">Posts</a>
  <a href="/about/">About</a>
  {{themeSelectMobile}}
  <!-- <a class="subscribe" href="#">subscribe →</a> -->
</div>

<main>
  <div class="page-intro">
    <div class="kicker">// ongoing series &amp; tools</div>
    <h1>Projects</h1>
    <p>Cybersecurity homelab projects, custom tools, and CTF writeups.</p>
  </div>

  <div class="status-filter">
    <span class="tag-filter active" data-filter="all">All</span>
    <span class="tag-filter" data-filter="active">Active</span>
    <span class="tag-filter" data-filter="complete">Complete</span>
  </div>

  <div class="project-grid">

    {{projectList}}

  </div>
</main>

<footer>
  <span><a href="https://takibyte.com">takibyte.com</a> — est. 2026</span>
  <span><a href="https://github.com/takibyte">GitHub</a> · <a href="https://tryhackme.com/p/takibyte">TryHackMe</a></span>
</footer>

<script>
  // Mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const mobileNav = document.getElementById('mobileNav');
  menuToggle.addEventListener('click', () => {
    const isOpen = mobileNav.classList.toggle('open');
    menuToggle.classList.toggle('open', isOpen);
    menuToggle.setAttribute('aria-expanded', isOpen);
  });

  // Status filter functionality
  const tagFilters = document.querySelectorAll('.tag-filter');
  const projects = document.querySelectorAll('.project-card');

  let activeTag = 'all';

  function applyFilters() {
    projects.forEach(project => {
      const status = project.dataset.status || '';
      const visible = activeTag === 'all' || status === activeTag;
      project.style.display = visible ? '' : 'none';
    });
  }

  tagFilters.forEach(tag => {
    tag.addEventListener('click', () => {
      tagFilters.forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      activeTag = tag.dataset.filter;
      applyFilters();
    });
  });

  applyFilters(); // enforces default filter state on load

</script>

</body>
</html>
