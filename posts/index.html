<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <title>Posts | takibyte blog</title>
    <meta name="description" content="takibyte blog is a personal blog about creating a cybersecurity and networking home-lab. It features projects and posts, focussed on hands-on learning and experimentation.">
    
    <script>
        const t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
    </script>

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/assets/icons/site.webmanifest">

    <!-- Styles -->
    <link rel='stylesheet' type='text/css' media='screen' href='/css/main.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='/css/template.css'>
</head>
<body>

    <div class="template">

        <div class="nav-container">

            <div class="title">takibyte blog</div>

            <div class="nav">
                <div class="nav-option">
                    <a href="/" class="nav-link">Home</a>
                </div>

                <div class="nav-option">
                    <a href="/projects/" class="nav-link">Projects</a>
                </div>

                <div class="nav-option">
                    <a href="/posts/" class="nav-link active">Posts</a>
                </div>
                
                <div class="nav-option">
                    <a href="/about/" class="nav-link">About</a>
                </div>
            </div>

        </div>

    </div>

    <div class="blog-content">

        <div id="post-container">
            <ul id="post-list">
                {{postList}}
            </ul>
        </div>
        
    </div>
    
</body>
</html>
